# Minimal single-node Teleport config for local integration testing.
# NOT for production: self-signed certs, static token, insecure clients.
version: v3
teleport:
  nodename: teleportconnect-it
  data_dir: /var/lib/teleport
  log:
    output: stderr
    severity: INFO

auth_service:
  enabled: "yes"
  listen_addr: 0.0.0.0:3025
  cluster_name: teleportconnect.local
  # Multiplex web, db, ssh, and tunnel traffic over the single proxy web
  # port (TLS routing). Required for the provider's tunnels to work.
  proxy_listener_mode: multiplex
  # Static join token used by db_service registration. Local-only.
  tokens:
    - "node,db,proxy:teleportconnect-it-token"

ssh_service:
  enabled: "yes"
  labels:
    role: bastion
    env: it

db_service:
  enabled: "yes"
  databases:
    - name: appdb-postgres
      protocol: postgres
      uri: postgres:5432
      static_labels:
        env: it
        engine: postgres

proxy_service:
  enabled: "yes"
  web_listen_addr: 0.0.0.0:3080
  # public_addr controls the SAN on the auto-generated self-signed cert, so
  # the client dialing localhost:3080 sees a matching name. Clients still
  # connect with insecure = true because the cert is self-signed.
  public_addr: ["localhost:3080"]
